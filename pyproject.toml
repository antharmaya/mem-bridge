[project]
name = "memory-bridge"
dynamic = ["version"]
description = "Unified local memory of every AI agent conversation on your machine, with an independent plugin for Hermes Agent and an MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antharmaya Labs", email = "hello@antharmaya.com" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7",
]
keywords = [
    "memory",
    "agent-memory",
    "hermes-agent",
    "mcp",
    "model-context-protocol",
    "claude-code",
    "codex",
    "gemini-cli",
    "cursor",
    "sqlite",
    "fts5",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=6.0,<7",
]
semantic = [
    "model2vec>=0.3,<1",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://antharmaya.com/tools/memory-bridge"
Source = "https://github.com/antharmaya/mem-bridge"
Issues = "https://github.com/antharmaya/mem-bridge/issues"
Changelog = "https://github.com/antharmaya/mem-bridge/blob/main/CHANGELOG.md"

[project.scripts]
memory-bridge = "memory_bridge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "memory_bridge.__version__" }

[tool.setuptools.packages.find]
where = ["."]
# `src` is the deprecated 0.5.x import name, kept as an alias for 0.6.x only.
include = ["memory_bridge*", "src"]

[tool.setuptools.package-data]
"memory_bridge.db" = ["*.md"]
"memory_bridge.db.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"
