[project]
name = "antharmaya-memory-bridge"
version = "0.4.2"
description = "Unified agent memory for Hermes — photographic memory of every AI conversation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Antharmaya Labs", email = "hello@antharmaya.com" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=6.0,<7",
]
semantic = [
    "model2vec>=0.3,<1",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://antharmaya.com/memory-bridge"
Repository = "https://github.com/antharmaya/mem-bridge"

[project.scripts]
memory-bridge = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
