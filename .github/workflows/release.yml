name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: build, verify tag, smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c 'import memory_bridge; print(memory_bridge.__version__)')"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match memory_bridge.__version__ $PKG"
            exit 1
          fi

      - name: test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: build
        run: |
          python -m pip install build twine
          rm -rf dist
          python -m build
          twine check --strict dist/*
          ls dist/
          test -f "dist/memory_bridge-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      - name: smoke-test the wheel in a fresh venv
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp
          test "$(/tmp/v/bin/memory-bridge --version)" = "memory-bridge ${GITHUB_REF_NAME#v}"
          HOME=/tmp/home /tmp/v/bin/memory-bridge stats
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | HOME=/tmp/home /tmp/v/bin/memory-bridge mcp | grep -q "\"version\": \"${GITHUB_REF_NAME#v}\""

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/memory-bridge/
    permissions:
      id-token: write  # OIDC token for PyPI; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
