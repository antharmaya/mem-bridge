name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.11"; 3.14 is the newest stable release.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

      - name: installer syntax
        run: bash -n install.sh

  package:
    name: builds, metadata is valid, wheel runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # Catches a broken README or bad classifiers before a tag makes it
      # permanent. PyPI does not allow re-uploading a version.
      - name: twine check
        run: twine check --strict dist/*

      - name: smoke-test the wheel in a fresh venv
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp
          /tmp/v/bin/memory-bridge --version
          HOME=/tmp/home /tmp/v/bin/memory-bridge stats
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | HOME=/tmp/home /tmp/v/bin/memory-bridge mcp | grep -q '"serverInfo"'
