name: antharmaya-memory-bridge
# Keep in step with memory_bridge/__init__.py (__version__); a test enforces it.
version: "0.6.0"
description: "Memory Bridge — an independent memory provider that gives Hermes Agent recall of every AI agent conversation on this machine. Not affiliated with or endorsed by Nous Research."
author: "Antharmaya Labs"
license: MIT
platforms: [linux, macos, windows]

metadata:
  hermes:
    homepage: "https://antharmaya.com/tools/memory-bridge"
    repository: "https://github.com/antharmaya/mem-bridge"
    tags: [memory, agent-history, consolidation, claude-code, codex, gemini]
    category: Memory & Context
    min_hermes_version: "0.16.0"
    # Install location: $HERMES_HOME/plugins/antharmaya-bridge/
    # Activate:         memory.provider: antharmaya-bridge  (or `hermes memory setup`)
    # CLI (when active): hermes antharmaya-bridge <command>
